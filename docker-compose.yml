services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres # Correction : postgres au lieu de postgress
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: campusconnect-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  face-service:
    build:
      context: ../face-service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: campusconnect-face-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    container_name: campusconnect-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      face-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # ✅ On utilise le nom du conteneur pour être sûr à 100% que ça communique
      DB_URL: jdbc:postgresql://campusconnect-postgres:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: admin

      # ✅ Utilisation du nom du conteneur Kafka
      KAFKA_BOOTSTRAP_SERVERS: campusconnect-kafka:29092

      # ✅ Utilisation du nom du conteneur Face Service
      FACE_SERVICE_URL: http://campusconnect-face-service:8000

      MAIL_USERNAME: nzimbaaliocha15@gmail.com
      MAIL_PASSWORD: "mxxr oykv pfik mjex"

      JWT_SECRET: super-secret-key-for-docker-production-1234567890
      BIOMETRIC_FP_DEV_ALLOW_UNSIGNED: "false"

volumes:
  pgdata: